[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "medieval-generator"
version = "0.1.0"
description = "Generate immersive medieval survival scripts with image prompts"
authors = [{name = "YouTube Automation", email = "noreply@example.com"}]
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.scripts]
medieval-generator = "medieval_generator:main"

[tool.setuptools]
packages = { find = { where = ["src"] } }

[tool.setuptools."package-dir"]
"" = "src"
